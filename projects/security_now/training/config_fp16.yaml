# MLX-LM LoRA Training - Qwen2.5 1.5B (fast CPU inference)
#
# Small model for fast CPU-only inference in production.
# No HuggingFace login required (Apache 2.0 license).
# Should only need ~8GB RAM for training.
#
# Run: ./train_lora.sh config_fp16.yaml

# Model - Qwen2.5 1.5B for fast inference
model: "Qwen/Qwen2.5-1.5B-Instruct"

# LoRA configuration - balanced for memory
lora_layers: 4           # Fewer layers = less memory
lora_rank: 8             # Smaller rank = less memory
lora_alpha: 16           # 2x rank
lora_dropout: 0.05

# Training - conservative memory settings
batch_size: 1            # Keep at 1 to save memory
learning_rate: 2.0e-5
iters: 2000
warmup_steps: 100
weight_decay: 0.01
grad_checkpoint: true    # Essential for memory

# Data - use pre-split data for lower memory usage
# Run: python training/split_long_sequences.py ./training_data --max-tokens 512
data: "./training_data"
max_seq_length: 512      # Shorter sequences = less memory

# Output
adapter_path: "./adapters/security_now_qwen1.5b_v1"
save_every: 500
val_every: 100
