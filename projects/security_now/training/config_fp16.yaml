# MLX-LM LoRA Training - Qwen2.5 1.5B (fast CPU inference)
#
# Small model for fast CPU-only inference in production.
# No HuggingFace login required (Apache 2.0 license).
# Should only need ~8GB RAM for training.
#
# Run: ./train_lora.sh config_fp16.yaml

# Model - Qwen2.5 1.5B for fast inference
model: "Qwen/Qwen2.5-1.5B-Instruct"

# LoRA configuration - can be slightly more aggressive with small model
lora_layers: 8           # More layers since model is small
lora_rank: 16            # Slightly higher rank
lora_alpha: 32           # 2x rank
lora_dropout: 0.05

# Training
batch_size: 2            # Can increase with smaller model
learning_rate: 2.0e-5
iters: 2000
warmup_steps: 100
weight_decay: 0.01
grad_checkpoint: true

# Data - can handle longer sequences with small model
data: "./training_data"
max_seq_length: 1024

# Output
adapter_path: "./adapters/security_now_qwen1.5b_v1"
save_every: 500
val_every: 100
